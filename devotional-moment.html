<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Devotional Moment</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500&family=Figtree:wght@500;600&display=swap">
<style>
:root{--bg:#f6f4ee;--ink:#1d3a2f;--soft:#4f6b5c;--accent:#1f4d3c;--on:#fff;--chip:#e8efe7;--track:#dde5dc;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1a15;--ink:#e6efe8;--soft:#9fb8a9;--accent:#7fbf9c;--on:#0f1a15;--chip:#1a2a22;--track:#26382e}}
:root[data-theme="dark"]{--bg:#0f1a15;--ink:#e6efe8;--soft:#9fb8a9;--accent:#7fbf9c;--on:#0f1a15;--chip:#1a2a22;--track:#26382e}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:Figtree,system-ui,sans-serif;display:flex;justify-content:center}
.app{width:100%;max-width:480px;min-height:100%;display:flex;flex-direction:column;padding:20px 24px 28px}
.top{display:flex;align-items:center;gap:12px;font-weight:600;font-size:20px}
.logo{width:40px;height:40px;border-radius:11px;background:var(--accent);color:var(--on);display:grid;place-items:center;font-family:Newsreader,Georgia,serif;font-size:24px}
.bar{display:flex;align-items:center;gap:14px;margin:22px 0 28px;color:var(--soft);font-size:14px}
.back{background:none;border:0;color:var(--soft);font-size:22px;cursor:pointer;padding:4px 8px 4px 0;min-width:32px}
.back:disabled{opacity:.25;cursor:default}
.track{flex:1;height:6px;border-radius:3px;background:var(--track);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:3px;transition:width .35s}
main{flex:1;display:flex;flex-direction:column}
h1{font-family:Newsreader,Georgia,serif;font-weight:500;font-size:34px;line-height:1.15;margin:0 0 18px;text-align:center}
.chip{align-self:center;background:var(--chip);color:var(--accent);padding:9px 16px;border:0;border-radius:999px;font:600 15px Figtree,system-ui,sans-serif;margin-bottom:22px;cursor:pointer}.chip:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.verse-text{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:18px;line-height:1.5;color:var(--ink);background:var(--chip);border-radius:14px;padding:14px 16px;margin:0 0 20px}
.body{font-family:Newsreader,Georgia,serif;font-size:24px;line-height:1.5;color:var(--soft);margin:0 0 26px}
.body.verse{font-size:26px;color:var(--ink)}
textarea{width:100%;min-height:110px;border:1px solid var(--track);background:var(--chip);color:var(--ink);border-radius:14px;padding:14px;font:17px/1.4 Figtree,system-ui,sans-serif;resize:vertical;margin-bottom:22px}
.cta{width:100%;border:0;border-radius:18px;background:var(--accent);color:var(--on);font:600 19px Figtree,system-ui,sans-serif;padding:20px;cursor:pointer;margin-top:auto}
.cta:focus-visible,.skip:focus-visible,.back:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.skip{background:none;border:0;color:var(--soft);text-decoration:underline;font:500 16px Figtree,system-ui,sans-serif;margin:22px auto 0;cursor:pointer;padding:6px}
.note{text-align:center;color:var(--soft);font-size:14px;margin:14px 0 0}
.streak{text-align:center;font-family:Newsreader,Georgia,serif;font-size:60px;margin:6px 0 0;color:var(--accent)}
.center{text-align:center}
</style>
</head>
<body>
<div class="app">
  <div class="top"><div class="logo">D</div>Devotional Moment</div>
  <div class="bar"><button class="back" id="back" aria-label="Back">←</button><div class="track"><div class="fill" id="fill"></div></div><span id="count"></span></div>
  <main id="main"></main>
</div>
<script>
var P=[
{t:"He wants to be near you.",r:"James 4:8",v:"Draw nigh to God, and he will draw nigh to you.",p:"Lord, You said if I draw near to You, You will draw near to me (James 4:8). I’m coming to You before anything else today. Not for what You can give, but for You. Quiet the noise, hold my attention, and be my first thought and my first word. In Jesus’ name, amen."},
{t:"Start with thanks.",r:"1 Thessalonians 5:18",v:"In every thing give thanks: for this is the will of God in Christ Jesus concerning you.",p:"Father, Your word says to give thanks in everything, for this is Your will for me (1 Thessalonians 5:18). Before I ask for anything, thank You for breath, for this new day, and for every mercy I overlook. Let a grateful heart lead my morning. In Jesus’ name, amen."},
{t:"He has promised to guide you.",r:"Psalm 32:8",v:"I will instruct thee and teach thee in the way which thou shalt go: I will guide thee with mine eye.",p:"Lord, You promised to teach me the way I should go and to counsel me with Your eye on me (Psalm 32:8). I don’t want to guess my way through today. Show me what is wise, give me the humility to ask for advice, and the courage to act on what You show me. Shut every door that isn’t Yours. In Jesus’ name, amen."},
{t:"You were made on purpose.",r:"Jeremiah 29:11",v:"For I know the thoughts that I think toward you, saith the LORD, thoughts of peace, and not of evil, to give you an expected end.",p:"Father, You know the plans You have for me, plans for peace and not harm, to give me a future and a hope (Jeremiah 29:11). I’m not here by accident. Show me what You made me for, and give me the focus to say no to what distracts me from it. Let my work today serve that purpose. In Jesus’ name, amen."},
{t:"You do not have to be afraid.",r:"Isaiah 41:10",v:"Fear thou not; for I am with thee: be not dismayed; for I am thy God: I will strengthen thee; yea, I will help thee.",p:"Lord, You said, “Fear not, for I am with you; I will strengthen you and help you” (Isaiah 41:10). I name my fears before You now, the ones I hide and the ones I carry quietly. Replace them with Your presence. Where I feel small, be my strength. In Jesus’ name, amen."},
{t:"Chains can break.",r:"John 8:36",v:"If the Son therefore shall make you free, ye shall be free indeed.",p:"Jesus, You said whoever the Son sets free is free indeed (John 8:36). I bring You every habit, craving and chain that has a hold on me. I can’t break them in my own strength, so I ask for Yours. Give me honesty to admit where I’m weak, courage to ask others for help, and strength to walk away from what is destroying me. Today, make me free. In Jesus’ name, amen."},
{t:"You are forgiven.",r:"1 John 1:9",v:"If we confess our sins, he is faithful and just to forgive us our sins, and to cleanse us from all unrighteousness.",p:"Father, Your word says if I confess my sins, You are faithful and just to forgive me and cleanse me (1 John 1:9). I confess what I’ve done and what I’ve left undone. Wash me clean. Help me forgive those who have wronged me, as You have forgiven me. In Jesus’ name, amen."},
{t:"Cover your household.",r:"Joshua 24:15",v:"As for me and my house, we will serve the LORD.",p:"Lord, like Joshua, I declare that as for me and my house, we will serve the LORD (Joshua 24:15). Cover my family today. Guard their health, their hearts and their paths. Heal what is broken between us and make our home a place where You are honoured. In Jesus’ name, amen."},
{t:"Love well today.",r:"1 John 4:7",v:"Beloved, let us love one another: for love is of God; and every one that loveth is born of God, and knoweth God.",p:"Father, Your word says let us love one another, for love comes from You (1 John 4:7). Bless my relationships: my partner, my friends, my colleagues. Make me patient, quick to listen and slow to take offence. Mend any bridge that needs mending today. In Jesus’ name, amen."},
{t:"He is your healer.",r:"Jeremiah 17:14",v:"Heal me, O LORD, and I shall be healed; save me, and I shall be saved: for thou art my praise.",p:"Lord, I pray as Jeremiah did: heal me and I will be healed; save me and I will be saved, for You are my praise (Jeremiah 17:14). Touch my body, strengthen my mind, and renew my energy. Give me wisdom to rest and to care for the body You gave me. In Jesus’ name, amen."},
{t:"He will provide.",r:"Philippians 4:19",v:"But my God shall supply all your need according to his riches in glory by Christ Jesus.",p:"Father, You promised to supply all my needs according to Your riches in glory (Philippians 4:19). I bring You my work, my business and my finances. Give me wisdom, open the right doors, and keep me honest and diligent in everything I do. Teach me to trust You as my provider. In Jesus’ name, amen."},
{t:"Hand Him the weight.",r:"1 Peter 5:7",v:"Casting all your care upon him; for he careth for you.",p:"Lord, You invite me to cast all my cares on You, because You care for me (1 Peter 5:7). I hand You the worries running through my mind this morning. I don’t have to carry them. Replace my anxiety with Your peace. In Jesus’ name, amen."},
{t:"Pray for your nation.",r:"1 Timothy 2:1–2",v:"I exhort therefore, that, first of all, supplications, prayers, intercessions, and giving of thanks, be made for all men; for kings, and for all that are in authority; that we may lead a quiet and peaceable life in all godliness and honesty.",p:"Father, Your word urges prayer for all people, for leaders and those in authority, that we may live peaceful and godly lives (1 Timothy 2:1–2). I lift up my nation. Give our leaders wisdom and integrity, raise honest men and women, and bring justice and peace. Use me where I’m placed. In Jesus’ name, amen."},
{t:"Go in His protection.",r:"Psalm 91:11",v:"For he shall give his angels charge over thee, to keep thee in all thy ways.",p:"Lord, Your word says You give Your angels charge over me, to keep me in all my ways (Psalm 91:11). I step into this day under Your protection. Go before me, guard my steps and my words, and bring me home safely. I walk in Your strength. In Jesus’ name, amen."}
];
var X=[
[["Seek Him early.","Psalm 63:1","O God, thou art my God; early will I seek thee: my soul thirsteth for thee.","Give me a hunger for You that nothing else can satisfy."],["Love Him with everything.","Matthew 22:37","Thou shalt love the Lord thy God with all thy heart, and with all thy soul, and with all thy mind.","Make You the first love of my heart, my mind and my strength."],["Be still before Him.","Psalm 46:10","Be still, and know that I am God.","Slow me down. In the stillness, let me know You more."],["Stay connected to Him.","John 15:5","I am the vine, ye are the branches: He that abideth in me, and I in him, the same bringeth forth much fruit: for without me ye can do nothing.","Keep me abiding in You today, because without You I can do nothing."]],
[["He is good.","Psalm 107:1","O give thanks unto the LORD, for he is good: for his mercy endureth for ever.","I thank You for Your goodness that has followed me all my life."],["Come in with praise.","Psalm 100:4","Enter into his gates with thanksgiving, and into his courts with praise: be thankful unto him, and bless his name.","I enter Your presence with praise. You are worthy of my best."],["Remember His benefits.","Psalm 103:2","Bless the LORD, O my soul, and forget not all his benefits.","Open my eyes to every benefit I have forgotten. I bless Your name."],["Let thanks rule your heart.","Colossians 3:15","And let the peace of God rule in your hearts, to the which also ye are called in one body; and be ye thankful.","Let Your peace rule in my heart, and let thankfulness shape my whole day."]],
[["Commit your plans to Him.","Proverbs 16:3","Commit thy works unto the LORD, and thy thoughts shall be established.","I commit my plans and my work to You. Establish my thoughts and steady my steps."],["Listen for His voice.","Isaiah 30:21","And thine ears shall hear a word behind thee, saying, This is the way, walk ye in it.","Tune my ears to hear You. When I turn left or right, say clearly, this is the way."],["Ask for wisdom.","James 1:5","If any of you lack wisdom, let him ask of God, that giveth to all men liberally, and upbraideth not; and it shall be given him.","I lack wisdom, so I’m asking. Give me wisdom for every decision in front of me."],["Trust Him with the path.","Proverbs 3:5","Trust in the LORD with all thine heart; and lean not unto thine own understanding.","I trust You with all my heart. Where I can’t see ahead, lead me."]],
[["You are His workmanship.","Ephesians 2:10","For we are his workmanship, created in Christ Jesus unto good works, which God hath before ordained that we should walk in them.","Show me the good works You prepared for me, and give me grace to walk in them."],["He works all things together.","Romans 8:28","And we know that all things work together for good to them that love God, to them who are the called according to his purpose.","Help me trust that You are working even my hard seasons together for good."],["His counsel stands.","Proverbs 19:21","There are many devices in a man’s heart; nevertheless the counsel of the LORD, that shall stand.","Let Your purpose, not my many plans, be what stands in my life."],["Work as for Him.","Colossians 3:23","And whatsoever ye do, do it heartily, as to the Lord, and not unto men.","Help me give my best today and do all my work as unto You."]],
[["Whom shall you fear?","Psalm 27:1","The LORD is my light and my salvation; whom shall I fear? the LORD is the strength of my life; of whom shall I be afraid?","Be my light and my strength today, and drive out every fear."],["Fear is not from Him.","2 Timothy 1:7","For God hath not given us the spirit of fear; but of power, and of love, and of a sound mind.","I reject the spirit of fear. Fill me with power, love and a sound mind."],["Be strong and courageous.","Joshua 1:9","Have not I commanded thee? Be strong and of a good courage; be not afraid, neither be thou dismayed: for the LORD thy God is with thee whithersoever thou goest.","Go with me everywhere I go today, and make me strong and courageous."],["Trust Him when afraid.","Psalm 56:3","What time I am afraid, I will trust in thee.","When fear rises, I choose to trust You. Hold me steady."]],
[["He makes a way out.","1 Corinthians 10:13","There hath no temptation taken you but such as is common to man: but God is faithful, who will not suffer you to be tempted above that ye are able; but will with the temptation also make a way to escape, that ye may be able to bear it.","Show me the way out the moment temptation comes, and give me strength to take it."],["Stand fast in freedom.","Galatians 5:1","Stand fast therefore in the liberty wherewith Christ hath made us free, and be not entangled again with the yoke of bondage.","Keep me standing in the freedom You gave me and out of every old bondage."],["He lifts you out of the pit.","Psalm 40:2","He brought me up also out of an horrible pit, out of the miry clay, and set my feet upon a rock, and established my goings.","Lift me out of every pit I have fallen into. Set my feet on solid ground."],["Sin is not your master.","Romans 6:14","For sin shall not have dominion over you: for ye are not under the law, but under grace.","I declare that sin will not rule me. Cover me with Your grace and strengthen my will."]],
[["He removes it far away.","Psalm 103:12","As far as the east is from the west, so far hath he removed our transgressions from us.","Thank You for removing my sins so far from me. Help me stop carrying what You have already taken."],["Forgive as you were forgiven.","Ephesians 4:32","And be ye kind one to another, tenderhearted, forgiving one another, even as God for Christ’s sake hath forgiven you.","Soften my heart toward those who hurt me, and help me forgive them fully."],["He makes you clean.","Isaiah 1:18","Come now, and let us reason together, saith the LORD: though your sins be as scarlet, they shall be as white as snow.","Make me clean from every stain, and let me walk in that cleanness today."],["Ask for a clean heart.","Psalm 51:10","Create in me a clean heart, O God; and renew a right spirit within me.","Create in me a clean heart and renew a steadfast spirit within me."]],
[["Train them in His way.","Proverbs 22:6","Train up a child in the way he should go: and when he is old, he will not depart from it.","Help me lead the young ones in my life in Your ways by what I say and what I do."],["Let Him build your house.","Psalm 127:1","Except the LORD build the house, they labour in vain that build it.","Build my home. Without You, every effort is in vain."],["Unity at home.","Psalm 133:1","Behold, how good and how pleasant it is for brethren to dwell together in unity!","Bring unity to my family. Remove strife, and let peace live in our home."],["Peace for your children.","Isaiah 54:13","And all thy children shall be taught of the LORD; and great shall be the peace of thy children.","Teach my children Yourself, and let great peace rest on them."]],
[["Be a faithful friend.","Proverbs 17:17","A friend loveth at all times, and a brother is born for adversity.","Make me a friend who loves at all times, especially when it costs me."],["Better together.","Ecclesiastes 4:9–10","Two are better than one; because they have a good reward for their labour. For if they fall, the one will lift up his fellow.","Surround me with people who lift me up, and make me one who lifts others."],["Wear love above all.","Colossians 3:14","And above all these things put on charity, which is the bond of perfectness.","Clothe me with love above everything else, so that it holds all my relationships together."],["Live at peace.","Romans 12:18","If it be possible, as much as lieth in you, live peaceably with all men.","Help me do my part to live at peace with everyone, starting today."]],
[["He heals.","Psalm 103:3","Who forgiveth all thine iniquities; who healeth all thy diseases.","I trust You as my healer. Touch every part of me that needs healing."],["He heals the broken heart.","Psalm 147:3","He healeth the broken in heart, and bindeth up their wounds.","Bind up the wounds in my heart that I have not let anyone see."],["Health and a prospering soul.","3 John 1:2","Beloved, I wish above all things that thou mayest prosper and be in health, even as thy soul prospereth.","Let my body be strong and my soul prosper alongside it."],["Renew your strength.","Isaiah 40:31","But they that wait upon the LORD shall renew their strength; they shall mount up with wings as eagles; they shall run, and not be weary; and they shall walk, and not faint.","I wait on You. Renew my strength so I can run and not grow weary."]],
[["Commit your work to Him.","Psalm 37:5","Commit thy way unto the LORD; trust also in him; and he shall bring it to pass.","I commit my work and my plans to You. Bring them to pass in Your time."],["He gives the power to prosper.","Deuteronomy 8:18","But thou shalt remember the LORD thy God: for it is he that giveth thee power to get wealth.","Keep me humble and remembering that every gift comes from You. Give me ideas and strength to build well."],["Be diligent.","Proverbs 10:4","He becometh poor that dealeth with a slack hand: but the hand of the diligent maketh rich.","Make me diligent and disciplined. Let me not waste a single opportunity."],["Seek Him first.","Matthew 6:33","But seek ye first the kingdom of God, and his righteousness; and all these things shall be added unto you.","I put You first today. Order my priorities and add what I need."]],
[["Pray instead of worry.","Philippians 4:6–7","Be careful for nothing; but in every thing by prayer and supplication with thanksgiving let your requests be made known unto God. And the peace of God, which passeth all understanding, shall keep your hearts and minds through Christ Jesus.","I bring my requests to You with thanksgiving. Guard my heart and mind with Your peace."],["His peace is yours.","John 14:27","Peace I leave with you, my peace I give unto you: not as the world giveth, give I unto you. Let not your heart be troubled, neither let it be afraid.","I receive Your peace, not the world’s kind. Calm my troubled heart."],["Keep your mind on Him.","Isaiah 26:3","Thou wilt keep him in perfect peace, whose mind is stayed on thee: because he trusteth in thee.","Fix my mind on You so that I walk in perfect peace today."],["Come and rest.","Matthew 11:28","Come unto me, all ye that labour and are heavy laden, and I will give you rest.","I’m weary and carrying too much. I come to You for rest."]],
[["Righteousness lifts a nation.","Proverbs 14:34","Righteousness exalteth a nation: but sin is a reproach to any people.","Let righteousness rise in my nation, in its leaders and its people."],["Seek the peace of your city.","Jeremiah 29:7","And seek the peace of the city whither I have caused you to be carried away captives, and pray unto the LORD for it: for in the peace thereof shall ye have peace.","I pray for the peace of my city. Make me a source of that peace where I live."],["Blessed is the nation.","Psalm 33:12","Blessed is the nation whose God is the LORD.","Draw my nation to You. Heal our land and bless our people."],["Do justly.","Micah 6:8","He hath shewed thee, O man, what is good; and what doth the LORD require of thee, but to do justly, and to love mercy, and to walk humbly with thy God?","Teach me to do justly, love mercy and walk humbly with You, in my work and in my country."]],
[["Rest under His shadow.","Psalm 91:1","He that dwelleth in the secret place of the most High shall abide under the shadow of the Almighty.","I dwell in Your secret place today. Cover me with Your shadow."],["His name is a strong tower.","Proverbs 18:10","The name of the LORD is a strong tower: the righteous runneth into it, and is safe.","I run into Your name today and I am safe."],["He guards your going out and coming in.","Psalm 121:8","The LORD shall preserve thy going out and thy coming in from this time forth, and even for evermore.","Preserve my going out and my coming in, today and always."],["No weapon will prosper.","Isaiah 54:17","No weapon that is formed against thee shall prosper.","I stand on Your promise. Protect me and my family from every attack."]]
];
var D=Math.floor((Date.now()-new Date().getTimezoneOffset()*6e4)/864e5);
function card(k){var o=[P[k]].concat(X[k].map(function(a){return{t:a[0],r:a[1],v:a[2],p:["Lord","Father"][k%2]+", Your word says, “"+a[2]+"” ("+a[1]+"). "+a[3]+" In Jesus’ name, amen."}}));return o[(D+k)%o.length]}
var C=P.map(function(_,k){return card(k)});
var KEY="devmoment:v2",st={};
try{st=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){st={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
function dkey(d){return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate()}
var now=new Date(),today=dkey(now),yest=dkey(new Date(now.getTime()-864e5));
var N=C.length,i=0,prayed=0,showV=false;
var main=document.getElementById("main"),fill=document.getElementById("fill"),count=document.getElementById("count"),back=document.getElementById("back");
function render(){
  var done=i>=N;
  fill.style.width=(done?100:(i+1)/N*100)+"%";count.textContent=(done?N:i+1)+"/"+N;back.disabled=i===0;
  var h="";
  if(!done){
    var c=C[i];
    h='<h1>'+c.t+'</h1><button class="chip" id="chip" aria-expanded="'+showV+'">'+c.r+'</button>';
    if(showV)h+='<p class="verse-text">'+c.v+'</p>';
    h+='<p class="body">'+c.p+'</p><button class="cta" id="go">I’ve prayed</button><button class="skip" id="skip">Skip for now</button><p class="note">No timer. Your prayer is between you and God.</p>';
  }else{
    h='<h1>Your day starts here.</h1><p class="streak">'+(st.streak||0)+'</p><p class="note">'+((st.streak||0)===1?"day in a row":"days in a row")+'</p><p class="body center" style="margin-top:22px">You prayed '+prayed+' of '+N+' today. Come back tomorrow for new prayers.</p><button class="cta" id="go">Start over</button>';
  }
  main.innerHTML=h;window.scrollTo(0,0);
  document.getElementById("go").onclick=function(){
    if(done){i=0;prayed=0;showV=false}else{prayed++;mark();i++;showV=false}
    render();
  };
  var s=document.getElementById("skip");if(s)s.onclick=function(){i++;showV=false;render()};
  var ch=document.getElementById("chip");if(ch)ch.onclick=function(){showV=!showV;render()};
}
function mark(){
  if(st.last!==today){st.streak=(st.last===yest)?(st.streak||0)+1:1;st.last=today;save()}
}
back.onclick=function(){if(i>0){i--;showV=false;render()}};
render();
</script>
</body>
</html>
