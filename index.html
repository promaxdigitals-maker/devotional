.cta.alt{background:var(--chip);color:var(--accent);box-shadow:none;margin-top:10px}
.skip{display:block;background:none;border:0;color:var(--soft);text-decoration:underline;font:500 16px Figtree,system-ui,sans-serif;margin:14px auto 0;cursor:pointer;padding:6px}
.note{text-align:center;color:var(--soft);font-size:14px;margin:12px 0 0;line-height:1.5}
.chip{align-self:center;background:var(--chip);color:var(--accent);padding:9px 16px;border:0;border-radius:999px;font:600 15px Figtree,system-ui,sans-serif;margin-bottom:20px;cursor:pointer}
.chip.sm{margin:0;padding:10px 14px;font-size:14px}

.body{font-family:Newsreader,Georgia,serif;font-size:23px;line-height:1.5;color:var(--soft);margin:0 0 22px}
.body.big{font-size:24px;color:var(--ink);text-align:center}
.streak{text-align:center;font-family:Newsreader,Georgia,serif;font-size:64px;line-height:1;margin:4px 0 0;color:var(--accent)}
.center{text-align:center}
.week{display:flex;justify-content:space-between;margin:20px 0}

.card{background:var(--card);border:1.5px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:12px}
.card strong{display:block;font:500 21px/1.25 Newsreader,Georgia,serif;margin-bottom:6px}
.card p{margin:0;color:var(--soft);font-size:15px;line-height:1.5}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row label{font-weight:500;font-size:15px}
input[type=time]{font:500 17px Figtree,sans-serif;border:1.5px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg);color:var(--ink);margin-left:6px}
.steps{padding-left:22px;margin:0 0 12px;color:var(--ink);font-size:16px;line-height:1.5}
.steps li{margin-bottom:10px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  if(step===TOT-1){P.done=true;P.A=A;put(PK,P);step=-1;home=true;render(true);return}
  step++;render(true)
}
function ymd(d){var p=function(n){return(n<10?"0":"")+n};return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function rpc(fn,body){return fetch(SB+"/rest/v1/rpc/"+fn,{method:"POST",headers:{apikey:KEYPUB,Authorization:"Bearer "+KEYPUB,"Content-Type":"application/json"},body:JSON.stringify(body)}).catch(function(){})}
function u8(b){var p="=".repeat((4-b.length%4)%4),s=atob((b+p).replace(/-/g,"+").replace(/_/g,"/")),a=new Uint8Array(s.length);for(var k=0;k<s.length;k++)a[k]=s.charCodeAt(k);return a}
function tzn(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone}catch(e){return"UTC"}}
function standalone(){return navigator.standalone||(window.matchMedia&&matchMedia("(display-mode: standalone)").matches)}
function isIOS(){return/iPad|iPhone|iPod/.test(navigator.userAgent)}
function sync(sub){P.dev=P.dev||(crypto.randomUUID?crypto.randomUUID():"d"+Date.now()+Math.random().toString(16).slice(2));put(PK,P);return rpc("register_device",{p_id:P.dev,p_sub:sub.toJSON(),p_tz:tzn(),p_time:P.time||"06:30",p_watches:(A.watches||[]).map(function(j){return j+1})})}
function enable(b){
  if(isIOS()&&!standalone()){b.textContent="Add to Home Screen first";return}
  if(!("serviceWorker"in navigator&&"PushManager"in window&&"Notification"in window)){b.textContent="Not supported here";return}
  b.textContent="Turning on…";
  Notification.requestPermission().then(function(r){if(r!=="granted")throw 0;return navigator.serviceWorker.register("/sw.js")}).then(function(){return navigator.serviceWorker.ready})
  .then(function(reg){return reg.pushManager.getSubscription().then(function(s){return s||reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:u8(VAPID)})})})
  .then(function(sub){return sync(sub)}).then(function(){P.push=true;put(PK,P);render(false)}).catch(function(){b.textContent="Allow notifications to turn on"});
}
function off(b){
  if(P.dev)rpc("stop_reminders",{p_id:P.dev});
  var f=function(){P.push=false;put(PK,P);render(false)};
  if("serviceWorker"in navigator)navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(s){return s&&s.unsubscribe()}).then(f,f);else f();
}
function remCard(){var t=(A.watches||[]).length?'':'<input type="time" id="rt" value="'+(P.time||"06:30")+'">';
  if(P.push)return'<div class="card"><div class="row"><label>Reminder'+t+'</label><button class="chip sm" id="pushoff">Turn off</button></div><p style="margin-top:10px">Reminders are on. We’ll nudge you if you haven’t prayed yet.</p></div>';
  return'<div class="card"><div class="row"><label>Reminder'+t+'</label><button class="chip sm" id="push">Turn on</button></div><p style="margin-top:10px">We store a device ID, your reminder time and whether you prayed today, only to remind you. No name or account. <button class="skip" id="ics" style="display:inline;margin:0;padding:0;font-size:14px">Use a calendar alarm instead</button></p></div>'}
function curWatch(){var h=now.getHours();return h>=21?6:h>=18?5:h>=15?4:h>=12?3:h>=9?2:h>=6?1:7}
function wcard(n){var l=(wrows||[]).filter(function(x){return x.watch===n});if(!l.length)return null;var x=l[(D+n)%l.length];return{t:x.title,r:x.ref,v:x.verse,p:x.prayer||(["Lord","Father"][n%2]+", Your word says, “"+x.verse+"” ("+x.ref+"). "+x.ask+" In Jesus’ name, amen.")}}
function wdone(){return(st.wdone&&st.wdone[today])||[]}
function openWatch(n){if(n<1||n>7)return;wk=n;picking=false;step=-1;render(true)}
function watchV(anim){
  if(!wrows)return load();
  var c=wcard(wk);bar.hidden=false;track.style.visibility="hidden";back.disabled=false;count.textContent="";
  if(!c){paint(head(WN[wk-1])+'<p class="sub">No prayers are loaded for this hour yet.</p><div class="foot"><button class="cta" id="wback">Back</button></div>',anim);return}
  paint('<p class="note" style="margin:0">'+WT[wk-1]+'</p>'+head(WN[wk-1])+'<span class="chip">'+esc(c.r)+'</span><p class="verse-text">'+esc(c.v)+'</p><p class="body">'+esc(c.p)+'</p><div class="foot"><button class="cta" id="wamen">Amen, I’ve prayed</button><button class="skip" id="wback">Not now</button></div>',anim);
}
function watchCard(){var cw=curWatch(),dn=wdone(),sel=(A.watches||[]).map(function(j){return j+1});
  var g=WS.map(function(nm,j){var n=j+1;return'<button class="opt'+(dn.indexOf(n)>-1?' on':'')+'" data-w="'+n+'" style="padding:12px 14px;font-size:15px"><span>'+WT[j]+'<small>'+nm+(n===cw?' · now':sel.indexOf(n)>-1?' · reminder':'')+'</small></span><i></i></button>'}).join("");
  return'<div class="card"><strong>Prayer Watch</strong><p>Now: '+WN[cw-1]+'. '+dn.length+' of 7 kept today.</p><div class="opts apps" style="margin-top:12px">'+g+'</div><button class="skip" id="wpick">Choose my hours and reminders</button></div>'}
function pickV(anim){
  bar.hidden=false;track.style.visibility="hidden";back.disabled=false;count.textContent="";
  var sel=A.watches||[],items=WT.map(function(t,j){return[t+" · "+WN[j]]});
  var links=sel.map(function(j){return'<button class="chip sm" data-cw="'+(j+1)+'" style="margin:0 8px 8px 0">Copy link: '+WT[j]+'</button>'}).join("");
  paint(head("Choose your watch hours","Pick the hours you can keep. You’ll get a reminder at each one.")+list("watches",items,1)+'<div class="row" style="margin:12px 0"><button class="chip sm" id="w3">3 core hours</button><button class="chip sm" id="w7">All 7</button></div>'+(sel.length?'<div class="card"><strong>Automations</strong><p>In Shortcuts, add a Time of Day automation for each hour with the action Open URL, and paste that hour’s link. Automations open Safari. For streaks and reminders, tap the notification, which opens the app.</p><div style="margin-top:12px">'+links+'</div></div>':'')+'<div class="foot"><button class="cta" id="wsave">Save my hours</button></div>',anim);
}
function wamen(){var l=wdone();if(l.indexOf(wk)<0)l.push(wk);st.wdone={};st.wdone[today]=l;put(KEY,st);mark();if(P.push&&P.dev)rpc("log_watch",{p_id:P.dev,p_date:ymd(now),p_watch:wk});wexit()}
function wexit(){wk=0;picking=false;C=[];if(!P.done)step=0;else home=true;render(true)}
function wsave(){P.A=A;put(PK,P);syncNow();picking=false;home=true;render(true)}
function syncNow(){if(P.push&&"serviceWorker"in navigator)navigator.serviceWorker.ready.then(function(r){return r.pushManager.getSubscription()}).then(function(s){if(s)sync(s)})}
function route(){var h=location.hash,m=h.match(/^#watch=(\d)$/);
  if(m){history.replaceState(null,"",location.pathname);openWatch(+m[1])}
  else if(h==="#pray"){history.replaceState(null,"",location.pathname);quick=true;step=-1;home=false;wk=0;picking=false;C=[];render(true)}}
function say(t,b){var u=location.origin;if(navigator.share){navigator.share({title:"Devotional Moment",text:t,url:u}).catch(function(){})}else{try{navigator.clipboard.writeText(t+" "+u);b.textContent="Link copied"}catch(x){b.textContent=u}}}
function ics(b){var t=(P.time||"06:30").split(":"),d=new Date();d.setDate(d.getDate()+1);var p=function(n){return(n<10?"0":"")+n},ds=d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+"T"+t[0]+t[1]+"00",ts=new Date().toISOString().replace(/[-:]/g,"").split(".")[0]+"Z";
  var x=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Devotional Moment//EN","BEGIN:VEVENT","UID:pray-first@"+location.host,"DTSTAMP:"+ts,"DTSTART:"+ds,"DURATION:PT10M","RRULE:FREQ=DAILY","SUMMARY:Pray first","DESCRIPTION:Before any app, open Devotional Moment: "+location.origin,"BEGIN:VALARM","TRIGGER:PT0M","ACTION:DISPLAY","DESCRIPTION:Pray first","END:VALARM","END:VEVENT","END:VCALENDAR"].join("\r\n");
  try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([x],{type:"text/calendar"}));a.download="pray-first.ics";document.body.appendChild(a);a.click();a.remove();b.textContent="Added, check Calendar"}catch(e){b.textContent="Not supported here"}}
main.onclick=function(e){
  var wb=e.target.closest("[data-w]");if(wb){openWatch(+wb.getAttribute("data-w"));return}
  var cl=e.target.closest("[data-cw]");if(cl){try{navigator.clipboard.writeText(location.origin+"/#watch="+cl.getAttribute("data-cw"));cl.textContent="Copied"}catch(x){}return}
  var o=e.target.closest(".opt");
  if(o){var box=o.parentNode,k=box.getAttribute("data-k"),j=+o.getAttribute("data-j"),multi=box.getAttribute("data-x")==="1",mx=+box.getAttribute("data-m"),a=(A[k]||[]).slice(),p=a.indexOf(j);
    if(multi){if(p>-1)a.splice(p,1);else if(!mx||a.length<mx)a.push(j)}else a=[j];
    A[k]=a;P.A=A;put(PK,P);render(false);return}
  var b=e.target.closest("button");if(!b)return;var id=b.id;
  if(id==="go"){if(b.dataset.retry){load();return}if(step>=0){next();return}
    if(home){home=false;C=[];render(true);return}
    if(i>=N){C=[];quick=false;if(!P.done)step=0;else home=true;render(true)}else{prayed++;mark();i++;showV=false;showP=false;render(true)}}
  else if(id==="skip"){i++;showV=false;showP=false;render(true)}
  else if(id==="chip"){showV=!showV;render(false)}
  else if(id==="sp"){showP=!showP;render(false)}
  else if(id==="pg"||id==="po"){sess=id==="pg"?"g":"o";render(true)}
  else if(id==="share"){var z=stats();say("I’m starting my day with a short prayer before I open any other app. Day "+z.s+" so far. Try it:",b)}
  else if(id==="acct"){var z2=stats();say("I’m praying before I open my apps, and I’m on day "+z2.s+". Will you check on me this week and ask if I prayed? Join me:",b)}
  else if(id==="ics"){ics(b)}
  else if(id==="push"){enable(b)}
  else if(id==="pushoff"){off(b)}
  else if(id==="wamen"){wamen()}else if(id==="wback"){wexit()}else if(id==="wpick"){picking=true;render(true)}else if(id==="wsave"){wsave()}
  else if(id==="w3"){A.watches=[0,2,4];P.A=A;put(PK,P);render(false)}else if(id==="w7"){A.watches=[0,1,2,3,4,5,6];P.A=A;put(PK,P);render(false)}
  else if(id==="copy"){try{navigator.clipboard.writeText(location.origin+"/#pray");b.textContent="Link copied"}catch(x){b.textContent=location.origin+"/#pray"}}
};
main.onchange=function(e){if(e.target.id==="rt"&&e.target.value){P.time=e.target.value;put(PK,P);syncNow()}};
function reset(){P.done=false;put(PK,P);step=1;C=[];render(true)}
back.onclick=function(){if(step<0&&(wk||picking)){wexit();return}if(step>0){step--;showV=false;render(true)}else if(step<0&&!home){if(i>0){i--;showV=false;showP=false;render(false)}else{home=true;C=[];render(true)}}};
document.getElementById("gear").onclick=function(){if(confirm("Change your answers? Your streak stays."))reset()};
window.addEventListener("hashchange",route);
if("serviceWorker"in navigator)navigator.serviceWorker.addEventListener("message",function(e){var d=e.data||{};if(d.watch)openWatch(d.watch)});
if(/^#(watch=\d|pray)$/.test(location.hash))route();else render(true);
</script>
